name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    # The shared-catalog suite defends a frozen schema contract (SPEC.md 9), so
    # it must run here rather than only where a developer happens to have
    # PostgreSQL. Without BABEL_TEST_POSTGRES the suite skips itself, which
    # would silently retire the allowlist gate.
    #
    # The service container serves that suite, which opens connections itself.
    # It cannot serve the two-instance acceptance: that drives the shipped
    # commands, so it reaches PostgreSQL through Babel's configuration document,
    # which cannot express an unencrypted connection. Those tests provision
    # their own TLS cluster with initdb, which is why the server binaries are
    # put on PATH below and why BABEL_REQUIRE_POSTGRES turns a missing install
    # into a failure rather than a skip.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: babel
          POSTGRES_PASSWORD: babel
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      BABEL_TEST_POSTGRES: postgres://babel:babel@127.0.0.1:5432/postgres?sslmode=disable
      BABEL_REQUIRE_POSTGRES: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install restic (pinned)
        run: |
          curl -sSL -o restic.bz2 \
            https://github.com/restic/restic/releases/download/v0.19.1/restic_0.19.1_linux_amd64.bz2
          echo "f415415624dcc452f2a02b8c33641791a8c6d6d3b65bbb3543fcf9a25151585c  restic.bz2" | sha256sum -c -
          bunzip2 restic.bz2
          chmod +x restic
          sudo mv restic /usr/local/bin/restic
          restic version

      - name: Expose PostgreSQL server binaries
        run: |
          dir=$(ls -d /usr/lib/postgresql/*/bin 2>/dev/null | sort -V | tail -1 || true)
          if [ -z "$dir" ]; then
            sudo apt-get update
            sudo apt-get install -y postgresql
            dir=$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -1)
          fi
          echo "$dir" >> "$GITHUB_PATH"
          "$dir/initdb" --version
          "$dir/pg_ctl" --version

      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test -count=1 ./...

  # The race detector is its own job rather than another step in `test`.
  # -race roughly triples a suite's runtime (~200s of ./internal/... becomes
  # ~3.5 minutes), and `test` already carries the slowest thing in CI, the
  # two-instance e2e acceptance. Appending -race there would add those minutes
  # to the critical path directly; as a separate job it runs concurrently with
  # `test` and finishes well inside that job's wall time, so the gate costs the
  # pipeline nothing it was not already spending.
  #
  # Scope is ./internal/..., which is where the concurrency lives:
  # sharedcatalog's server-time fenced leases and their takeover tests,
  # worker's goroutine-owning pipe readers and process trees, web's response
  # buffer (whose own test comment concedes the buffer exists because of a data
  # race whether or not a given run detects it), run, and frontier.
  # ./test/e2e/... is excluded deliberately: it drives the shipped binaries as
  # child processes, and the race detector instruments only the process it
  # builds, so running that suite under -race would triple the cost of CI's
  # slowest job to watch a test harness rather than the code under test.
  race:
    runs-on: ubuntu-latest

    # The same service, for the same reason as `test`: without
    # BABEL_TEST_POSTGRES the shared-catalog suite skips itself wholesale, and
    # a race job that skips the fenced-lease takeover tests is precisely the
    # vacuous gate this job exists to avoid. The server binaries are not put on
    # PATH here, because only the e2e acceptance provisions its own cluster
    # with initdb and that suite is out of scope for this job.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: babel
          POSTGRES_PASSWORD: babel
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      BABEL_TEST_POSTGRES: postgres://babel:babel@127.0.0.1:5432/postgres?sslmode=disable
      BABEL_REQUIRE_POSTGRES: "1"
      # -race is built through cgo and needs a C toolchain. ubuntu-latest ships
      # gcc and Go defaults to CGO_ENABLED=1 there, so this pins what is
      # already true rather than changing it; no other job sets CGO_ENABLED, so
      # nothing here depends on a cgo-free build.
      CGO_ENABLED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # internal/cli's repository-dependent tests skip when restic is not on
      # PATH, and those are the tests that drive a child process and pump its
      # output. Installing it keeps this job's coverage equal to the local run
      # it stands in for instead of quietly narrower.
      - name: Install restic (pinned)
        run: |
          curl -sSL -o restic.bz2 \
            https://github.com/restic/restic/releases/download/v0.19.1/restic_0.19.1_linux_amd64.bz2
          echo "f415415624dcc452f2a02b8c33641791a8c6d6d3b65bbb3543fcf9a25151585c  restic.bz2" | sha256sum -c -
          bunzip2 restic.bz2
          chmod +x restic
          sudo mv restic /usr/local/bin/restic
          restic version

      - name: go test -race
        run: go test -race -count=1 ./internal/...

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Typecheck
        working-directory: web
        run: bunx tsc --noEmit

      - name: Build
        working-directory: web
        run: bun run build

  # The browser channels SPEC.md §548 names - what the address bar and history
  # actually hold, and whether a reload or back/forward re-serves a cached
  # response - are unobservable from Go. This job is the only place they are
  # checked, and the test hard-fails rather than skipping when CI has no
  # Chrome, because skipping would retire the gate silently.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # The acceptance drives the real archive surface, so the credential under
      # test is genuinely in use rather than reported as unconfigured.
      - name: Install restic (pinned)
        run: |
          curl -sSL -o restic.bz2 \
            https://github.com/restic/restic/releases/download/v0.19.1/restic_0.19.1_linux_amd64.bz2
          echo "f415415624dcc452f2a02b8c33641791a8c6d6d3b65bbb3543fcf9a25151585c  restic.bz2" | sha256sum -c -
          bunzip2 restic.bz2
          chmod +x restic
          sudo mv restic /usr/local/bin/restic
          restic version

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Locate Chrome
        run: |
          chrome="$(command -v google-chrome || command -v google-chrome-stable || true)"
          test -n "$chrome" || { echo "no Chrome on the runner"; exit 1; }
          "$chrome" --version
          echo "BABEL_TEST_CHROME=$chrome" >> "$GITHUB_ENV"

      # Build the binary before the browser job rather than inside a test's
      # lifecycle. leak.test.ts compiles it in beforeAll when BABEL_TEST_BINARY
      # is unset, which put a cold build of the whole module inside a
      # puppeteer timeout, on a two-core runner already hosting Chrome and two
      # mock servers. That passed while the module was small and started
      # failing as ERR_CONNECTION_REFUSED once it was not — a timing failure
      # that reads like a broken web surface. The test already supports a
      # prebuilt binary; using it makes the build a step that either succeeds
      # or fails on its own terms.
      - name: Build babel for the browser acceptance
        run: |
          go build -o "$RUNNER_TEMP/babel" ./cmd/babel
          echo "BABEL_TEST_BINARY=$RUNNER_TEMP/babel" >> "$GITHUB_ENV"

      - name: Browser leak acceptance
        working-directory: web
        run: bun run test:browser

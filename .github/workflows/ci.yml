name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    # The shared-catalog suite defends a frozen schema contract (SPEC.md 9), so
    # it must run here rather than only where a developer happens to have
    # PostgreSQL. Without BABEL_TEST_POSTGRES the suite skips itself, which
    # would silently retire the allowlist gate.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: babel
          POSTGRES_PASSWORD: babel
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      BABEL_TEST_POSTGRES: postgres://babel:babel@127.0.0.1:5432/postgres?sslmode=disable

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install restic (pinned)
        run: |
          curl -sSL -o restic.bz2 \
            https://github.com/restic/restic/releases/download/v0.19.1/restic_0.19.1_linux_amd64.bz2
          echo "f415415624dcc452f2a02b8c33641791a8c6d6d3b65bbb3543fcf9a25151585c  restic.bz2" | sha256sum -c -
          bunzip2 restic.bz2
          chmod +x restic
          sudo mv restic /usr/local/bin/restic
          restic version

      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test -count=1 ./...

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Typecheck
        working-directory: web
        run: bunx tsc --noEmit

      - name: Build
        working-directory: web
        run: bun run build

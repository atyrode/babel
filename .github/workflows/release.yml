name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # THE RELEASE ITSELF, WITH NO BINARY IN IT. A `v*` tag used to cross-compile ./cmd/babel for
  # four platforms and upload the tarballs; there is no Go tree to build. What a tag publishes
  # now is the plugin bundles the gate below verified, which `deliver` attaches — so this job
  # exists to create the release those assets hang off, and to carry the version's own notes.
  # Module versions already published stay resolvable through the proxy; only new publication
  # of a binary stops.
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract changelog section
        run: |
          set -euo pipefail
          mkdir -p dist
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" { grab = 1; next }
            grab && (/^## / || /^\[/) { exit }
            grab { print }
          ' CHANGELOG.md > dist/notes.md
          test -s dist/notes.md || echo "See CHANGELOG.md." > dist/notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Babel $GITHUB_REF_NAME" \
            --notes-file dist/notes.md \
            --verify-tag

  # The plugin family is the product: the same reusable gate that runs on every PR - check,
  # test, pack, verify against a real engine - packs the tagged revision and uploads
  # dist/ as the `manifold-plugins` artifact. The `uses:` ref and MANIFOLD_REV are one
  # revision and move together (.github/workflows/manifold-plugins.yml says why). `deps:code`
  # builds the dependency closure first, because verify composes omp, then Code, then Babel.
  plugins:
    uses: atyrode/manifold/.github/workflows/plugins.yml@743ee75a92b64b75b4a97244ebd58297c1287164
    with:
      plugins-dir: "."
      prepare-command: bun run deps:code

  # Babel requires Code, and Code requires omp (docs/building.md "Code is a second pin"): a
  # preview that receives Babel alone refuses composition. This job builds the exact dependency
  # bundles the gate verified against - Code at CODE_REV, omp at the pin Code names -
  # through the same `deps:code` the gate runs, in the same sibling layout the reusable workflow
  # lays out, and hands them to `deliver` so the preview receives the closure in order.
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: caller
      - name: Read the Manifold pin
        id: rev
        working-directory: caller
        run: |
          rev="$(tr -d '[:space:]' < MANIFOLD_REV)"
          [ -n "$rev" ] || { echo "MANIFOLD_REV is empty"; exit 1; }
          echo "rev=$rev" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: atyrode/manifold
          ref: ${{ steps.rev.outputs.rev }}
          path: manifold
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - name: Install the kit
        working-directory: manifold
        run: bun install --frozen-lockfile
      - name: Build the dependency closure
        working-directory: caller
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run deps:code
          mkdir -p ../deps
          cp .integration/code/plugins/.integration/omp/plugins/dist/*.manifold-plugin.json ../deps/
          cp .integration/code/plugins/dist/*.manifold-plugin.json ../deps/
          (cd ../deps && sha256sum ./*.manifold-plugin.json | sed "s#\./##" > SHA256SUMS && cat SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: dependency-plugins
          path: deps
          if-no-files-found: error

  # The verified bundles ride the release, then reach the integrated preview through its
  # receiver: `plugin <asset-url> <sha256>` over the forced-command SSH key, dependency closure
  # first and baseline before its parts - omp, then Code, then Babel - exactly what a developer
  # types from dev-01 (docs/building.md "Where a change is proved"). Production
  # (manifold.tyrode.dev) is installed by the operator, by hand, and is not touched here.
  deliver:
    needs: [release, plugins, dependencies]
    runs-on: ubuntu-latest
    environment:
      name: development
      url: ${{ vars.DEV_DEPLOY_URL }}
    env:
      TAG: ${{ github.ref_name }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: manifold-plugins
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: dependency-plugins
          path: deps

      - name: Attach the bundles to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp dist/SHA256SUMS dist/manifold-plugins.SHA256SUMS
          cp deps/SHA256SUMS deps/dependency-plugins.SHA256SUMS
          gh release upload "$TAG" --repo "$REPOSITORY" --clobber \
            dist/*.manifold-plugin.json dist/manifold-plugins.SHA256SUMS \
            deps/*.manifold-plugin.json deps/dependency-plugins.SHA256SUMS

      - name: Install on the preview, dependencies and parents first
        env:
          DEV_DEPLOY_SSH_KEY: ${{ secrets.DEV_DEPLOY_SSH_KEY }}
          DEV_DEPLOY_HOST: ${{ vars.DEV_DEPLOY_HOST }}
          DEV_DEPLOY_USER: ${{ vars.DEV_DEPLOY_USER }}
        run: |
          set -euo pipefail
          [ -n "$DEV_DEPLOY_HOST" ] || { echo "no preview receiver configured; bundles are on the release"; exit 0; }
          key=$(mktemp); printf '%s\n' "$DEV_DEPLOY_SSH_KEY" > "$key"; chmod 600 "$key"
          trap 'rm -f "$key"' EXIT
          cat dist/SHA256SUMS deps/SHA256SUMS > sums
          # THIS LIST IS HAND-MAINTAINED, AND IT IS THE ONE THING HERE THAT IS. Everything above
          # globs — `dist/*.manifold-plugin.json` is attached whole, and `sums` is both families'
          # checksums — but the receiver takes one bundle per call, and a hub refuses a part
          # whose baseline is not installed yet, so the ORDER is the reason this is written out
          # rather than derived: dependencies first, then each baseline before its own parts.
          # A new plugin therefore has to be added here by hand. The `no sum for` guard below
          # catches a bundle that was asked for and not built; nothing catches a bundle that was
          # built and never asked for, which is how a part reaches a release and never a preview.
          for id in \
            atyrode.omp atyrode.omp.accounts atyrode.omp.gateway \
            atyrode.code atyrode.code.accounts atyrode.code.generator atyrode.code.usage \
            atyrode.babel atyrode.babel.feed atyrode.babel.watch atyrode.babel.jev; do
            file="$id.manifold-plugin.json"
            sha=$(awk -v f="$file" '$2 == f { print $1 }' sums)
            [ -n "$sha" ] || { echo "no sum for $file"; exit 1; }
            url="https://github.com/$REPOSITORY/releases/download/$TAG/$file"
            for attempt in 1 2 3; do
              if ssh -o StrictHostKeyChecking=accept-new -o BatchMode=yes -i "$key" \
                "$DEV_DEPLOY_USER@$DEV_DEPLOY_HOST" "plugin $url $sha"; then break; fi
              [ "$attempt" -lt 3 ] || exit 1
              sleep 15
            done
          done

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build binaries
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 \
              go build -trimpath -ldflags "-s -w" -o dist/babel ./cmd/babel
            tar -czf "dist/babel_${GITHUB_REF_NAME}_${target%/*}_${target#*/}.tar.gz" -C dist babel
            rm dist/babel
          done
          (cd dist && sha256sum *.tar.gz > SHA256SUMS)

      - name: Extract changelog section
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" { grab = 1; next }
            grab && (/^## / || /^\[/) { exit }
            grab { print }
          ' CHANGELOG.md > dist/notes.md
          test -s dist/notes.md || echo "See CHANGELOG.md." > dist/notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Babel $GITHUB_REF_NAME" \
            --notes-file dist/notes.md \
            --verify-tag \
            dist/*.tar.gz dist/SHA256SUMS

  # The plugin family is the product (decision 91): the same reusable gate that runs on every
  # PR - check, test, pack, verify against a real engine - packs the tagged revision and uploads
  # dist/ as the `manifold-plugins` artifact. The `uses:` ref and plugins/MANIFOLD_REV are one
  # revision and move together (.github/workflows/manifold-plugins.yml says why).
  plugins:
    uses: atyrode/manifold/.github/workflows/plugins.yml@637cbb79faf6d9616e2003bb3e9ec0490ede9d8e
    with:
      plugins-dir: plugins

  # The verified bundles ride the release, then reach the integrated preview through its
  # receiver: `plugin <asset-url> <sha256>` over the forced-command SSH key, baseline before its
  # parts, exactly what a developer types from dev-01 (plugins/README.md "Where a change is
  # proved"). Production (manifold.tyrode.dev) is installed by the operator, by hand, and is not
  # touched here.
  deliver:
    needs: [release, plugins]
    runs-on: ubuntu-latest
    environment:
      name: development
      url: ${{ vars.DEV_DEPLOY_URL }}
    env:
      TAG: ${{ github.ref_name }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: manifold-plugins
          path: dist

      - name: Attach the bundles to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp dist/SHA256SUMS dist/manifold-plugins.SHA256SUMS
          gh release upload "$TAG" --repo "$REPOSITORY" --clobber \
            dist/*.manifold-plugin.json dist/manifold-plugins.SHA256SUMS

      - name: Install on the preview, parents first
        env:
          DEV_DEPLOY_SSH_KEY: ${{ secrets.DEV_DEPLOY_SSH_KEY }}
          DEV_DEPLOY_HOST: ${{ vars.DEV_DEPLOY_HOST }}
          DEV_DEPLOY_USER: ${{ vars.DEV_DEPLOY_USER }}
        run: |
          set -euo pipefail
          [ -n "$DEV_DEPLOY_HOST" ] || { echo "no preview receiver configured; bundles are on the release"; exit 0; }
          key=$(mktemp); printf '%s\n' "$DEV_DEPLOY_SSH_KEY" > "$key"; chmod 600 "$key"
          trap 'rm -f "$key"' EXIT
          for id in atyrode.babel atyrode.babel.feed atyrode.babel.watch; do
            file="$id.manifold-plugin.json"
            sha=$(awk -v f="$file" '$2 == f { print $1 }' dist/SHA256SUMS)
            [ -n "$sha" ] || { echo "no sum for $file"; exit 1; }
            url="https://github.com/$REPOSITORY/releases/download/$TAG/$file"
            for attempt in 1 2 3; do
              if ssh -o StrictHostKeyChecking=accept-new -o BatchMode=yes -i "$key" \
                "$DEV_DEPLOY_USER@$DEV_DEPLOY_HOST" "plugin $url $sha"; then break; fi
              [ "$attempt" -lt 3 ] || exit 1
              sleep 15
            done
          done

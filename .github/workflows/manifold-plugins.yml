name: manifold-plugins

# Babel's manifold plugins (plugins/) are built against the manifold plugin kit read from a
# sibling checkout pinned by plugins/MANIFOLD_REV (plugins/README.md). The whole job lives in
# manifold's reusable workflow: it checks this repository out beside atyrode/manifold at that
# revision so plugins/tsconfig.json's `../../manifold` resolves exactly as it does on a
# developer's machine, then runs `check`, `test`, `pack` and `verify` from plugins/package.json
# and uploads dist/ as the `manifold-plugins` artifact.
#
# The `uses:` ref below and plugins/MANIFOLD_REV are the same revision and are bumped together:
# the workflow reads the kit's commands from the checkout the file names, so a ref ahead of the
# file would run a newer workflow against an older kit.

on:
  push:
    branches: [main]
    paths:
      - "plugins/**"
      - ".github/workflows/manifold-plugins.yml"
  pull_request:
    paths:
      - "plugins/**"
      - ".github/workflows/manifold-plugins.yml"

permissions:
  contents: read

jobs:
  bundles:
    uses: atyrode/manifold/.github/workflows/plugins.yml@3f899e54e063d5dd0731d4fd1a443ac95940b972
    with:
      plugins-dir: plugins

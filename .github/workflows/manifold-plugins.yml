name: manifold-plugins

# Babel IS a manifold plugin family (decision 91, docs/manifold-plan.md): plugins/ is the
# product, and this gate is the one that says the artifact composes. The whole job lives in
# manifold's reusable workflow, which checks this repository out beside atyrode/manifold at the
# revision in plugins/MANIFOLD_REV — the sibling layout plugins/tsconfig.json and plugins/pack.sh
# resolve on a developer's machine — then runs `check`, `test`, `pack` and `verify` from
# plugins/package.json and uploads dist/ as the `manifold-plugins` artifact.
#
# The `uses:` ref below and plugins/MANIFOLD_REV are the same revision and are bumped together:
# a ref ahead of the file would run a newer workflow against an older kit. 637cbb79 is Manifold
# `main`, and it carries the four primitives the plugin is built on: the plugin database (ADR
# 0034) with a failure-atomic lifecycle (atyrode/manifold#536), which the store cannot start
# without; per-operation `concurrentJobs` admission (#551); the `job_progress` event (#552); and
# metered brokered inference (ADR 0038, #554).
#
# Delivery is not here. Every change is proved on preview.manifold.tyrode.dev or a local
# preview-equivalent hub: between releases through `bun run dev -- --deliver` from dev-01, and
# on a `v*` tag through release.yml, which runs this same gate against the tagged revision and
# hands the verified bundles to the preview's receiver. Production (manifold.tyrode.dev) is
# installed by the operator, by hand, from the plugin manager (plugins/README.md, "Where a
# change is proved").

on:
  push:
    branches:
      - "plugin/**"
  pull_request:
    paths:
      - "plugins/**"
      - ".github/workflows/manifold-plugins.yml"

permissions:
  contents: read

jobs:
  bundles:
    uses: atyrode/manifold/.github/workflows/plugins.yml@637cbb79faf6d9616e2003bb3e9ec0490ede9d8e
    with:
      plugins-dir: plugins

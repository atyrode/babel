name: manifold-plugins

# Babel's manifold plugins (plugins/) are built against the manifold plugin kit read from a
# sibling checkout pinned by plugins/MANIFOLD_REV (plugins/README.md). Both repositories are
# checked out side by side under the workspace so plugins/tsconfig.json's `../../manifold`
# resolves exactly as it does on a developer's machine.

on:
  push:
    branches: [main]
    paths:
      - "plugins/**"
      - ".github/workflows/manifold-plugins.yml"
  pull_request:
    paths:
      - "plugins/**"
      - ".github/workflows/manifold-plugins.yml"

permissions:
  contents: read

jobs:
  bundles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: babel

      - name: Read the pinned manifold revision
        id: manifold
        run: echo "rev=$(tr -d '[:space:]' < babel/plugins/MANIFOLD_REV)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: atyrode/manifold
          ref: ${{ steps.manifold.outputs.rev }}
          path: manifold

      # ADR 0001 pins manifold's runtime at exactly 1.3.13; the kit's `pack` is a Bun program.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      # The kit and the protocol depend on zod and nothing else; installing only those two
      # workspaces keeps the SDK checkout's install to the packages the bundles inline.
      - name: Install the plugin kit's dependencies
        working-directory: manifold
        run: bun install --frozen-lockfile --filter '@manifold/plugin-kit' --filter '@manifold/protocol'

      - name: Install
        working-directory: babel/plugins
        run: bun install --frozen-lockfile

      - name: Typecheck
        working-directory: babel/plugins
        run: bunx tsc --noEmit -p tsconfig.json

      - name: Test
        working-directory: babel/plugins
        run: bun test

      - name: Pack
        working-directory: babel/plugins
        run: ./pack.sh

      - uses: actions/upload-artifact@v4
        with:
          name: manifold-plugins
          path: babel/plugins/dist/
          if-no-files-found: error
